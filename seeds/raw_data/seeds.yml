version: 2

seeds:
  - name: media_history
    description: Raw Instagram media history data
    config:
      column_types:
        USER_ID: VARCHAR
        IS_STORY: VARCHAR
        CAROUSEL_ALBUM_ID: VARCHAR
        ID: VARCHAR
        MEDIA_TYPE: VARCHAR
        MEDIA_PRODUCT_TYPE: VARCHAR
        CREATED_TIME: VARCHAR

  - name: media_insights
    description: Raw Instagram media insights data with engagement metrics
    config:
      column_types:
        ID: VARCHAR
        LIKE_COUNT: VARCHAR
        COMMENT_COUNT: VARCHAR
        VIDEO_PHOTO_IMPRESSIONS: VARCHAR
        VIDEO_PHOTO_REACH: VARCHAR
        VIDEO_PHOTO_SAVED: VARCHAR
        VIDEO_VIEWS: VARCHAR
        CAROUSEL_ALBUM_ENGAGEMENT: VARCHAR
        CAROUSEL_ALBUM_IMPRESSIONS: VARCHAR
        CAROUSEL_ALBUM_REACH: VARCHAR
        CAROUSEL_ALBUM_SAVED: VARCHAR
        CAROUSEL_ALBUM_VIDEO_VIEWS: VARCHAR
        STORY_IMPRESSIONS: VARCHAR
        STORY_REACH: VARCHAR
        NAVIGATION: VARCHAR
        REEL_REACH: VARCHAR
        REEL_SAVED: VARCHAR
        VIDEO_PHOTO_ENGAGEMENT: VARCHAR
        STORY_EXITS: VARCHAR
        STORY_REPLIES: VARCHAR
        STORY_TAPS_BACK: VARCHAR
        STORY_TAPS_FORWARD: VARCHAR
        STORY_SWIPE_FORWARD: VARCHAR
        REEL_AGGREGATED_ALL_PLAYS_COUNT: VARCHAR
        REEL_CLIPS_REPLAYS_COUNT: VARCHAR
        REEL_COMMENTS: VARCHAR
        REEL_LIKES: VARCHAR
        REEL_PLAYS: VARCHAR
        REEL_SHARES: VARCHAR
        REEL_TOTAL_INTERACTIONS: VARCHAR
        STORY_VIEWS: VARCHAR
        REEL_VIEWS: VARCHAR
        VIDEO_PHOTO_VIEWS: VARCHAR
        VIDEO_PHOTO_SHARES: VARCHAR
        CAROUSEL_ALBUM_SHARES: VARCHAR
        CAROUSEL_ALBUM_VIEWS: VARCHAR
        STORY_SHARES: VARCHAR
        TIMESTAMP: VARCHAR
